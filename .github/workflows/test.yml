name: Private Payment CI

on:
    workflow_dispatch:
    push:
        branches: ["main"]
    pull_request:
        branches: ["main"]

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - name: FAZER CHECKOUT DO REPOSITÓRIO
              uses: actions/checkout@v4
            
            - name: DEFINIR VERSÃO DO NODE.JS
              uses: actions/setup-node@v4
              with:
                  node-version: 20

            - name: INSTALAR DEPENDÊNCIAS
              run: npm install

            - name: INICIAR API
              run: npm start &

            - name: ESPERAR A API INICIAR  
              run: sleep 10

            - name: RODAR TESTES
              run: npm test

            
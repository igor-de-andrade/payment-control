name: private payment CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Fazer checkout do repositório
        uses: actions/checkout@v4

      - name: Definir versão do node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependências
        run: npm ci

      - name: Iniciar a API e aguardar
        run: |
          npm start &
          for i in {1..30}; do
            curl -sf -X POST http://localhost:4000/graphql \
              -H "Content-Type: application/json" \
              -d '{"query":"{ __typename }"}' && exit 0
            sleep 1
          done
          exit 1

      - name: Executar testes
        run: npm test